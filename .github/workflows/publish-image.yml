name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, Git tag or SHA (empty = selected branch or tag)
        required: false
        type: string
      tag:
        description: Docker image tag to publish, for example 1.0.4 (no Git tag required)
        required: true
        type: string
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve source and image metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease || false }}
          INPUT_REF: ${{ inputs.ref || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          DISPATCH_PUBLISH_LATEST: ${{ inputs.publish_latest || false }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            source_ref="refs/tags/${RELEASE_TAG}"
            image_tag="${RELEASE_TAG}"
            publish_latest=true
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              publish_latest=false
            fi
          else
            source_ref="${INPUT_REF:-${GITHUB_SHA}}"
            image_tag="${INPUT_TAG}"
            publish_latest="${DISPATCH_PUBLISH_LATEST}"
          fi

          if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Image tag must be Docker-compatible, for example 1.0.4"
            exit 1
          fi

          if [[ -z "${source_ref}" || "${source_ref}" == *$'\n'* || "${source_ref}" == *$'\r'* ]]; then
            echo "::error::Source ref must be a single branch, Git tag or commit SHA"
            exit 1
          fi

          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "publish_latest=${publish_latest}" >> "${GITHUB_OUTPUT}"
          printf 'Source ref: %s\nImage: %s/%s:%s\n' \
            "${source_ref}" "${REGISTRY}" "${GITHUB_REPOSITORY,,}" "${image_tag}"

      - name: Check out build source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=Aniu
            org.opencontainers.image.description=AI trading agent workspace
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Build and push Linux amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
